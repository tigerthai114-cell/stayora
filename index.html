<style>
:root{--teal:#01403e;--teal2:#002b2b;--gold:#e0b55e;--bg:#f4f3ec;--ink:#1d2b2a;--line:#dcd8cc;--card:#fff;--acc:#01403e;--pbg:#01403e;--pfg:#fff;--today:#f1e6cc;--bad:#9b2c2c;--good:#2f6b4f;--muted:#8a8f87}
*{box-sizing:border-box}body{margin:0;font:15px/1.4 system-ui,sans-serif;background:var(--bg);color:var(--ink)}
header{background:var(--teal);color:#fff;padding:12px 16px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.brand{font-weight:700;letter-spacing:.12em;color:var(--gold)}header small{opacity:.8}
main{max-width:1000px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px;margin-bottom:12px}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}
.stat b{display:block;font-size:24px;color:var(--acc)}
nav{display:flex;gap:6px;margin-bottom:12px;flex-wrap:wrap}
button,input,select{font:inherit;padding:9px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--ink)}
textarea{background:var(--card);color:var(--ink)}
button{cursor:pointer}button.p{background:var(--pbg);color:var(--pfg);border-color:var(--pbg)}button.t.on{background:var(--gold);border-color:var(--gold);color:#1b1b1b}
button.s{padding:5px 8px;font-size:13px}
form.g{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:8px}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%}th,td{border:1px solid var(--line);padding:6px;text-align:center;font-size:13px;white-space:nowrap}
td.occ{background:var(--teal);color:#fff}td.tod,th.tod{background:var(--today)}
.row{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px 0;border-bottom:1px solid var(--line)}
.auth{max-width:360px;margin:8vh auto}.auth input{width:100%;margin-bottom:8px}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--teal2);color:#fff;padding:10px 16px;border-radius:8px;display:none}
#toast.show{display:block}#toast.err{background:#9b2c2c}
.rg{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}@media(min-width:700px){.rg{grid-template-columns:repeat(3,1fr)}}
.rc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px}.rc h4{margin:8px 0 0;font-size:15px;color:var(--acc)}
.mg{display:grid;grid-template-columns:repeat(7,1fr);gap:2px;text-align:center;font-size:12px}.mg .h{color:var(--muted);font-size:11px}
.d{padding:5px 0;border-radius:6px;cursor:pointer;font-weight:500}.d.on{background:var(--gold);color:#1b1b1b}.d.td{outline:2px solid var(--acc)}
.nav2{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}.sum{margin:6px 0}
@media print{header,nav,.stats,button,#toast{display:none!important}body{background:#fff!important}:root{--bg:#fff!important;--card:#fff!important;--ink:#1d2b2a!important;--line:#dcd8cc!important}}
@media print{body.pinv>*:not(#inv){display:none!important}#inv{position:static!important}#inv .noprint{display:none!important}}
.swg{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:10px}.sw{display:flex;align-items:center;gap:6px;text-align:left}
.sw span{width:16px;height:16px;border-radius:50%;display:inline-block;flex:none}.sw.on{outline:2px solid var(--acc)}
label{display:block;font-size:13px}input[type=color]{display:block;width:100%;height:44px;padding:2px;margin-top:4px}
.bdg{background:#c0392b;color:#fff;border-radius:10px;padding:0 6px;font-size:12px;margin-left:4px}.off{background:#fff3cd;border-color:#e0c36a;color:#3b3000}
#inv{--card:#fff;--ink:#1d2b2a;--line:#dcd8cc;color:#1d2b2a}

  if (a.error) return toast(a.error.message, 1);
  if (r.guest_id && f.get("fn") !== null) await sb.from("guests").update({ first_name: f.get("fn"), last_name: f.get("ln") }).eq("id", r.guest_id);
  if (r.status === "checked_in" && room !== x.room_id) {
    await setRoomQ(x.room_id, "available");
    await setRoomQ(room, "occupied");
  }
  S.edit = null; toast("Réservation modifiée."); refresh();
}
async function book(v) {
  const o = S.orgId, p = S.prop.id;
  if (v.co <= v.ci) return toast("Le départ doit être après l’arrivée.", 1);
  const g = await sb.from("guests").insert({ organization_id: o, property_id: p, first_name: v.fn, last_name: v.ln, email: v.em || null, phone: v.ph || null }).select().single();
  if (g.error) return toast(g.error.message, 1);
  const r = await sb.from("reservations").insert({ organization_id: o, property_id: p, guest_id: g.data.id, status: "confirmed", source: v.src, adults: Math.max(1, v.ad || 1), created_by: S.user.id, ...(v.total ? { total_amount: v.total } : {}) }).select().single();
  if (r.error) { await sb.from("guests").delete().eq("id", g.data.id); return toast(r.error.message, 1); }
  const x = await sb.from("reservation_rooms").insert({ organization_id: o, property_id: p, reservation_id: r.data.id, room_id: v.room, check_in: v.ci, check_out: v.co });
  if (x.error) {
    await sb.from("reservations").delete().eq("id", r.data.id); await sb.from("guests").delete().eq("id", g.data.id);
    return toast(x.error.code === "23P01" ? "Cette chambre est déjà réservée sur ces dates." : x.error.message, 1);
  }
  toast(v.msg || "Réservation créée."); refresh();
}
function createRes(e) {
  e.preventDefault(); const f = new FormData(e.target);
  book({ fn: f.get("fn"), ln: f.get("ln"), em: f.get("em"), ph: f.get("ph"), room: f.get("room"), ci: f.get("ci"), co: f.get("co"), ad: +f.get("ad"), src: f.get("src"), total: +f.get("total") || 0 });
}
function autoPlace(e) {
  e.preventDefault(); const f = new FormData(e.target), ci = f.get("ci"), co = f.get("co");
  if (co <= ci) return toast("Le départ doit être après l’arrivée.", 1);
  const free = S.rooms.filter(r => !["out_of_service", "maintenance"].includes(r.status) && !S.rr.some(x => x.room_id === r.id && x.is_blocking && x.check_in < co && ci < x.check_out))
    .sort((a, b) => String(a.number).localeCompare(String(b.number), undefined, { numeric: true }));
  if (!free.length) return toast("Aucune chambre libre sur ces dates.", 1);
  book({ fn: f.get("fn"), ln: f.get("ln"), room: free[0].id, ci, co, ad: +f.get("ad"), src: "direct", msg: "Réservé en chambre " + free[0].number + "." });
}
function filterRows(v) { v = v.toLowerCase(); document.querySelectorAll("#rl .row").forEach(r => r.style.display = r.dataset.s.includes(v) ? "" : "none"); }
async function setStatus(id, st) {
  const r = await sb.from("reservations").update({ status: st }).eq("id", id);
  if (r.error) return toast(r.error.message, 1);
  const x = S.rr.find(y => y.reservation_id === id);
  if (x && st === "checked_in") await setRoomQ(x.room_id, "occupied");
  if (x && st === "checked_out") await setRoomQ(x.room_id, "to_clean");
  refresh();
}

function roomsView() {
  const edit = ["org_admin", "manager"].includes(S.role);
  const form = edit ? `<div class="card"><h3>Ajouter une chambre</h3><form class="g" onsubmit="addRoom(event)"><input name="num" placeholder="Numéro" required><input name="name" placeholder="Nom"><input name="desc" placeholder="Description"><button class="p">Ajouter</button></form></div>` : "";
  const list = S.rooms.map(r => `<div class="row"><div><b>${esc(r.number)}</b> ${esc(r.name || "")}</div>
  <div><select onchange="roomStatus('${r.id}',this.value)">${Object.entries(RS).map(([k, l]) => `<option value="${k}" ${k === r.status ? "selected" : ""}>${l}</option>`).join("")}</select> <button class="s" onclick="reportIssue('${r.id}')">Signaler un problème</button></div></div>`).join("") || "<p>Aucune chambre.</p>";
  const imp = edit ? `<div class="card"><h3>Importer l’ancienne application</h3><p>Choisissez le fichier de sauvegarde, ou collez son texte.</p><input type="file" id="impFile" accept=".json,application/json"><textarea id="impTxt" rows="3" placeholder="…ou collez ici le texte de la sauvegarde" style="width:100%;margin:8px 0;font:inherit;padding:9px;border-radius:8px;border:1px solid var(--line)"></textarea><button class="p" onclick="doImport()">Importer</button></div>` : "";
  const todo = S.rooms.filter(r => ["to_clean", "cleaning"].includes(r.status));
  const clean = todo.length ? `<div class="card"><h3>Ménage à faire</h3>${todo.map(r => `<div class="row"><div><b>${esc(r.number)}</b> · ${esc(RS[r.status])}</div><div>${r.status === "to_clean" ? `<button class="p s" onclick="roomSet('${r.id}','cleaning')">Commencer</button>` : `<button class="p s" onclick="roomSet('${r.id}','available')">Terminé</button>`}</div></div>`).join("")}</div>` : "";
  const who = id => { const m = (S.team || []).find(t => t.user_id === id); return m ? String(m.email).split("@")[0] : ""; };
  const hist = (S.hist || []).length ? `<div class="card"><h3>Journal des chambres</h3>${S.hist.slice(0, 15).map(h => { const rm = S.rooms.find(r => r.id === h.room_id); return `<div class="row"><div><b>${esc(rm?.number)}</b> · ${esc(RS[h.old_status] || "—")} → ${esc(RS[h.new_status])}${h.note ? "<br>" + esc(h.note) : ""}</div><small>${esc(new Date(h.changed_at).toLocaleString(LOC(), { dateStyle: "short", timeStyle: "short" }))}${who(h.changed_by) ? "<br>" + esc(who(h.changed_by)) : ""}</small></div>`; }).join("")}</div>` : "";
  return clean + form + `<div class="card">${list}</div>` + hist + imp;
}
async function doImport() {
  const f = $("#impFile").files[0]; let txt = $("#impTxt").value.trim();
  if (f) txt = await f.text();
  if (!txt) return toast("Choisissez un fichier ou collez le texte.", 1);
  let d; try { d = JSON.parse(txt); } catch (e) { return toast("Fichier invalide.", 1); }
  if (!d || !Array.isArray(d.bookings) || !Array.isArray(d.rooms)) return toast("Ce n’est pas une sauvegarde de l’ancienne application.", 1);
  const o = S.orgId, p = S.prop.id, map = {}, dg = s => (String(s).match(/\d+/g) || []).pop(), t = today();
  for (const r of d.rooms) {
    let m = S.rooms.find(x => dg(x.number) && dg(x.number) === dg(r.name)) || S.rooms.find(x => x.number === r.name);
    if (!m) {
      const n = await sb.from("rooms").insert({ organization_id: o, property_id: p, number: String(r.name), name: String(r.name) }).select().single();
      if (n.error) return toast("Chambre « " + r.name + " » : " + n.error.message, 1);
      m = n.data; S.rooms.push(m);
    }
    map[r.id] = m.id;
  }
  let ok = 0; const skip = [];
  for (const b of d.bookings) {
    const room = map[b.room];
    if (!room || !(b.start < b.end)) { skip.push((b.name || "?") + " (données incomplètes)"); continue; }
    const parts = String(b.name || "Client").trim().split(/\s+/), ln = parts[parts.length - 1], fn = parts.length > 1 ? parts.slice(0, -1).join(" ") : "-";
    const st = b.end <= t ? "checked_out" : b.start <= t ? "checked_in" : "confirmed";
    const note = [b.notes, b.price ? "Prix/nuit : " + b.price : "", b.total ? "Total : " + b.total : "", b.pay ? "Paiement : " + b.pay : ""].filter(Boolean).join(" · ");
    const g = await sb.from("guests").insert({ organization_id: o, property_id: p, first_name: fn, last_name: ln }).select().single();
    if (g.error) { skip.push(b.name + " (" + g.error.message + ")"); continue; }
    const r = await sb.from("reservations").insert({ organization_id: o, property_id: p, guest_id: g.data.id, status: st, source: "import", adults: Math.max(1, +b.guests || 1), notes: note || null, created_by: S.user.id }).select().single();
    if (r.error) { await sb.from("guests").delete().eq("id", g.data.id); skip.push(b.name + " (" + r.error.message + ")"); continue; }
    const x = await sb.from("reservation_rooms").insert({ organization_id: o, property_id: p, reservation_id: r.data.id, room_id: room, check_in: b.start, check_out: b.end });
    if (x.error) { await sb.from("reservations").delete().eq("id", r.data.id); await sb.from("guests").delete().eq("id", g.data.id); skip.push(b.name + " (" + (x.error.code === "23P01" ? "chevauchement" : x.error.message) + ")"); continue; }
    ok++;
  }
  await refresh();
  alert(tr(ok + " réservation(s) importée(s)." + (skip.length ? "\n\nIgnorées (" + skip.length + ") :\n" + skip.join("\n") : "")));
}
async function addRoom(e) {
  e.preventDefault(); const f = new FormData(e.target);
  const r = await sb.from("rooms").insert({ organization_id: S.orgId, property_id: S.prop.id, number: f.get("num"), name: f.get("name") || null, description: f.get("desc") || null });
  if (r.error) return toast(r.error.message, 1); refresh();
}
async function setRoomQ(id, st, note) {
  let r = await sb.rpc("set_room_status", { p_room: id, p_status: st, p_note: note || null });
  if (r.error && /set_room_status|schema cache|PGRST202/.test(String(r.error.message) + String(r.error.code))) r = await sb.from("rooms").update({ status: st }).eq("id", id);
  return r;
}
async function roomSet(id, st, note) {
  const r = await setRoomQ(id, st, note);
  if (r.error) return toast(/not allowed|row-level|permission|42501/i.test(String(r.error.message) + String(r.error.code)) ? "Modification non autorisée pour votre rôle." : r.error.message, 1);
  refresh();
}
function roomStatus(id, st) { roomSet(id, st); }
function reportIssue(id) { const n = prompt(tr("Décrivez le problème :")); if (n && n.trim()) roomSet(id, "maintenance", n.trim()); }
async function addMember(e) {
  e.preventDefault(); const f = new FormData(e.target);
  const r = await sb.rpc("add_member", { p_org: S.orgId, p_email: f.get("em"), p_role: f.get("role") });
  if (r.error) return toast(/user_not_found/.test(r.error.message) ? "Aucun compte avec cet e-mail : la personne doit d’abord créer son compte." : /add_member|schema cache/.test(r.error.message) ? "Fonction d’équipe absente : étape Supabase à faire." : r.error.message, 1);
  toast("Membre ajouté."); refresh();
}
async function rmMember(id) {
  if (!confirm(tr("Retirer cette personne de l’équipe ?"))) return;
  const r = await sb.from("memberships").delete().eq("id", id);
  if (r.error) return toast(r.error.message, 1);
  toast("Membre retiré."); refresh();
}
function teamCard() {
  if (!["org_admin", "manager"].includes(S.role)) return "";
  const rows = (S.team || []).map(m => `<div class="row"><div><b>${esc(m.email)}</b><br>${esc(ROLE[m.role] || m.role)}</div>${S.role === "org_admin" && m.user_id !== S.user.id ? `<button class="s" onclick="rmMember('${m.membership_id}')">Retirer</button>` : ""}</div>`).join("") || "<p>Aucun membre.</p>";
  const form = S.role === "org_admin" ? `<form class="g" onsubmit="addMember(event)" style="margin-top:10px"><input name="em" type="email" placeholder="E-mail de l’employé" required><select name="role"><option value="manager">Manager</option><option value="receptionist">Réceptionniste</option><option value="housekeeping">Ménage</option><option value="org_admin">Administrateur</option></select><button class="p">Ajouter à l’équipe</button></form><small>La personne doit d’abord créer son compte avec cet e-mail (écran de connexion, « Créer un compte »).</small>` : "";
  return `<div class="card"><h3>Équipe</h3>${rows}${form}</div>`;
}
init().catch(showErr);
